name: Bug report
description: Something in blackwall does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please redact real hostnames, IPs, user names
        and passwords everywhere below (use `example.com`, `192.0.2.10`).
        Security issues go through private reporting, see SECURITY.md.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Keys pressed, commands run, view you were in.
      placeholder: |
        1. blackwall --context lab
        2. open an agent with Enter, press `s`
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: blackwall version
      description: Output of `blackwall --version` (or the release / commit you installed if the flag is missing).
      placeholder: v0.1.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: macOS 26 arm64 / Ubuntu 24.04 amd64
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - Homebrew cask
        - go install
        - release archive
        - built from source
        - other
    validations:
      required: true

  - type: input
    id: wazuh
    attributes:
      label: Wazuh version
      description: Manager version, e.g. from `GET /` on the Wazuh API or `/var/ossec/bin/wazuh-control info`.
      placeholder: 4.14.7
    validations:
      required: true

  - type: dropdown
    id: indexer
    attributes:
      label: Indexer configured
      description: Does the context have an `indexer:` section?
      options:
        - "yes"
        - "no"
    validations:
      required: true

  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options:
        - direct
        - ssh tunnel
        - blackwall-stack lab
    validations:
      required: false

  - type: textarea
    id: config
    attributes:
      label: Config snippet (redacted)
      description: The relevant context from `~/.config/blackwall/config.yaml`. Replace hosts, users and passwords.
      render: yaml
      placeholder: |
        contexts:
          work:
            wazuh:
              server:   wazuh.example.com
              port:     55000
              user:     blackwall-ro
              password: ${BW_WORK_WAZUH_PASSWORD}

  - type: textarea
    id: output
    attributes:
      label: Error output or screenshot
      description: Status bar message, stderr, or a screenshot (redacted).
