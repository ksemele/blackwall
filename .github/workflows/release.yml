name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Provenance attestations: OIDC token for Sigstore, write to the attestations API.
  id-token: write
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained PAT: ksemele/homebrew-tap, Contents read/write.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      # Signs every file listed in checksums.txt (archives, packages, SBOMs).
      # Verify: gh attestation verify <file> --repo ksemele/blackwall
      - uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: ./dist/checksums.txt
