# blackwall configuration
#
# Docs: https://github.com/ksemele/blackwall
#
# Switch contexts at runtime with `:ctx <name>` in the TUI,
# or set the default below.

current: example-master
select_context_on_start: true     # show picker at startup; set false to skip

contexts:

  example-master:
    description: "Replace this with your real Wazuh manager"
    # Loopback-only manager? Let blackwall open an ssh tunnel. wazuh/indexer
    # server and port below are then as seen FROM the ssh host (e.g. 127.0.0.1).
    # ssh:
    #   host: wazuh-manager          # ~/.ssh/config alias or user@host
    #   command: [sshpass, -e, ssh]  # optional prefix instead of plain ssh
    #                                # (sshpass -e reads SSHPASS from the env)
    #   connect_timeout: 10s
    wazuh:
      server:   wazuh.example.com
      port:     55000
      user:     wazuh
      password: ${BW_EXAMPLE_WAZUH_PASSWORD}
      tls:
        insecure_skip_verify: false
        # ca_file: /etc/blackwall/wazuh-ca.crt

  lab:
    description: "Docker test env (tests/bin/bw-lab), API on loopback"
    wazuh:
      server:   127.0.0.1
      port:     55000
      user:     wazuh
      password: wazuh               # lab-only credentials, see tests/README.md
      tls:
        insecure_skip_verify: true  # self-signed lab certificate
    indexer:
      server:   127.0.0.1
      port:     9200
      user:     admin
      password: Blackwall1!         # lab-only, public (tests/README.md)
      tls:
        insecure_skip_verify: true  # self-signed lab certificate
      # alerts:
      #   min_level: 5                            # default
      #   exclude_groups: [sca, blackwall_sessions]  # default

  # SSO (OIDC) instead of indexer passwords — needs an IdP, see README
  # "SSO (OIDC) login". For wazuh, user/password stay: the manager API
  # authenticates a run_as-capable service user and the token's claims
  # only name the person in the API logs.
  # sso:
  #   wazuh:
  #     server: wazuh.example.com
  #     port:   55000
  #     user:     ${BW_SSO_WAZUH_RUNAS_USER}
  #     password: ${BW_SSO_WAZUH_RUNAS_PASSWORD}
  #     auth:
  #       type: oidc
  #       issuer:    https://sso.example.com/realms/wazuh
  #       client_id: blackwall-cli
  #       # scopes: [openid, offline_access]      # default
  #       # run_as:                               # default; the RBAC rules
  #       #   - { name: user_name, claim: sub }   # match these context keys
  #   indexer:
  #     server: wazuh.example.com
  #     port:   9200
  #     auth:
  #       type: oidc
  #       issuer:    https://sso.example.com/realms/wazuh
  #       client_id: blackwall-cli
  #       # token: id_token                       # default; or access_token

ui:
  refresh_interval: 3s
  theme:            dark
  vim_keys:         true

logging:
  level: warn
  # file: ~/.local/state/blackwall/blackwall.log   # default if unset
