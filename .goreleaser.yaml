version: 2

project_name: blackwall

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: blackwall
    main: ./cmd/blackwall
    binary: blackwall
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    # Reproducible: same commit, same Go version -> same binary.
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X main.version=v{{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

nfpms:
  - id: packages
    package_name: blackwall
    file_name_template: "{{ .ConventionalFileName }}"
    formats: [deb, rpm]
    bindir: /usr/bin
    vendor: ksemele
    maintainer: Aleksei Krugliak
    homepage: https://github.com/ksemele/blackwall
    description: k9s-style terminal UI for Wazuh
    license: MIT
    section: admin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/blackwall/LICENSE
        file_info:
          mode: 0644
      - src: README.md
        dst: /usr/share/doc/blackwall/README.md
        file_info:
          mode: 0644
    mtime: "{{ .CommitDate }}"

# One SPDX SBOM per archive (needs syft on PATH).
sboms:
  - artifacts: archive

checksum:
  name_template: checksums.txt

changelog:
  sort: asc

release:
  footer: |
    ## Verify

    Every file below has a GitHub build provenance attestation (Sigstore):

    ```bash
    sha256sum --ignore-missing -c checksums.txt
    gh attestation verify <file> --repo ksemele/blackwall
    ```

    SBOMs (SPDX JSON) are attached as `*.sbom.json`.

homebrew_casks:
  - name: blackwall
    binaries: [blackwall]
    homepage: https://github.com/ksemele/blackwall
    description: k9s-style terminal UI for Wazuh
    caveats: |
      Short alias (skip it if `b` is already taken in your shell):
        alias b=blackwall
    repository:
      owner: ksemele
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    skip_upload: auto
    hooks:
      post:
        # The binary is not signed or notarized; without this Gatekeeper blocks it.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/blackwall"]
          end
